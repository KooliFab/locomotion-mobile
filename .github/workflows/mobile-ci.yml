name: Mobile CI Pipeline

on:
  push:
    branches: [main, master, feat/*, release/*]
  pull_request:
    branches: [main, master]

jobs:
  mobile-ci:
    name: Mobile Quality Checks (Format, Analyze, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static Analysis
        run: flutter analyze

      - name: Unit and Widget Tests
        run: flutter test --coverage

      - name: Build Staging APK
        env:
          # Smoke build only: signed with the debug key, not distributable.
          ALLOW_DEBUG_SIGNING: 'true'
        run: flutter build apk --flavor staging -t lib/main_staging.dart --dart-define=APP_ENV=staging

      - name: Build Production APK
        env:
          # Smoke build only: signed with the debug key, not distributable.
          ALLOW_DEBUG_SIGNING: 'true'
        run: flutter build apk --flavor prod -t lib/main_prod.dart --dart-define=APP_ENV=prod
